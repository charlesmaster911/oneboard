services:
  - type: web
    name: oneboard
    env: static
    staticPublishPath: dist
    buildCommand: npm ci && npm run build
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ONEBOARD_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
